services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: isater
      POSTGRES_USER: isater
      POSTGRES_PASSWORD: isater_local_only
    ports:
      - "5432:5432"
    volumes:
      - isater_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U isater -d isater"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  isater_postgres:
